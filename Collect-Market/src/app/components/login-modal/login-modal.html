@if (visible) {
  <div class="modal-backdrop" (click)="onBackdropClick()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <div class="modal-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#ffd700" stroke-width="1.5">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        </div>
      <h2 class="modal-title">Inicia sesión</h2>
      <p class="modal-sub">Necesitas una cuenta para añadir cartas al carrito o a favoritos.</p>
      <div class="modal-actions">
        <button class="modal-btn-primary" (click)="goToLogin()">Iniciar sesión</button>
        <button class="modal-btn-secondary" (click)="goToRegister()">Crear cuenta</button>
      </div>
      <button class="modal-close" (click)="onBackdropClick()">✕</button>
    </div>
  </div>
}
